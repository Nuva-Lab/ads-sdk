<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="Ads Agent Playground">Ads Agent 工作台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <a
        class="wordmark"
        href="/"
        aria-label="Ads Agent 工作台"
        data-i18n-attrs='{"aria-label": "Ads Agent Playground"}'
        ><span
          ><span data-i18n="Ads">广告</span
          ><span class="wordmark-light">
            <span data-i18n="Playground">工作台</span></span
          ></span
        ></a
      >
      <div class="header-actions">
        <button id="connection-button" class="connection-button">
          <span class="connection-dot"></span
          ><span id="connection-label"
            ><span data-i18n="Connect">连接</span></span
          >
        </button>
        <label class="language-control">
          <span id="language-icon" aria-hidden="true"></span>
          <select
            id="ui-language"
            aria-label="界面语言"
            data-i18n-attrs='{"aria-label":"Interface language"}'
          >
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
    </header>
    <nav
      class="mobile-nav"
      aria-label="工作台视图"
      data-i18n-attrs='{"aria-label": "Playground view"}'
    >
      <button id="mobile-workspace" class="active" type="button">
        <span data-i18n="Workspace">工作区</span></button
      ><button id="mobile-chat" type="button">
        <span data-i18n="Ads Agent">Ads Agent</span>
      </button>
    </nav>
    <div id="notice" role="status" hidden></div>
    <main class="workspace-layout">
      <section
        class="workspace"
        aria-label="创作工作区"
        data-i18n-attrs='{"aria-label": "Creation workspace"}'
      >
        <div class="workspace-toolbar">
          <div id="tabs" class="tabs" role="tablist"></div>
          <button
            id="refresh-workspace"
            class="icon-button"
            aria-label="刷新工作区"
            title="刷新工作区"
            data-i18n-attrs='{"aria-label": "Refresh workspace", "title": "Refresh workspace"}'
          >
            ↻
          </button>
        </div>
        <div id="workspace-content"></div>
      </section>
      <aside
        class="chat-panel"
        aria-label="Ads Agent 对话"
        data-i18n-attrs='{"aria-label": "Ads Agent chat"}'
      >
        <div class="chat-heading">
          <div class="agent-heading">
            <span class="agent-mark">✳</span>
            <h2><span data-i18n="Ads Agent">Ads Agent</span></h2>
            <span id="chat-status" class="status-badge" data-state="offline"
              ><span data-i18n="Offline">未连接</span></span
            >
          </div>
          <button
            id="new-session"
            class="icon-button"
            title="新对话"
            aria-label="新对话"
            disabled
            data-i18n-attrs='{"title": "New conversation", "aria-label": "New conversation"}'
          >
            ＋
          </button>
        </div>
        <div class="session-toolbar">
          <label class="session-select"
            ><span class="sr-only"
              ><span data-i18n="Conversation">对话</span></span
            ><select id="sessions" disabled>
              <option data-i18n="New conversation">新对话</option>
            </select></label
          >
          <details class="chat-menu">
            <summary
              aria-label="对话选项"
              title="对话选项"
              data-i18n-attrs='{"aria-label": "Conversation options", "title": "Conversation options"}'
            >
              •••
            </summary>
            <div class="menu-content">
              <button id="copy-conversation-id" disabled>
                <span data-i18n="Copy conversation ID">复制对话 ID</span>
              </button>
              <button id="reconnect" disabled>
                <span data-i18n="Refresh conversation">刷新对话</span>
              </button>
            </div>
          </details>
        </div>
        <div id="chat" role="log" aria-live="polite">
          <div class="chat-welcome">
            <div class="orb">✳</div>
            <h3><span data-i18n="Start a conversation">开始对话</span></h3>
            <p>
              <span
                data-i18n="Type a message or use @ to reference a saved resource."
                >输入消息，或使用 @ 引用已保存的资源。</span
              >
            </p>
            <button
              class="suggestion"
              data-prompt="请帮我编写广告脚本："
              data-i18n-attrs='{"data-prompt": "Help me write a script for "}'
            >
              <span data-i18n="Write a script">编写脚本</span>
              <span>↗</span></button
            ><button
              class="suggestion"
              data-prompt="请为以下内容生成视频提示词："
              data-i18n-attrs='{"data-prompt": "Create video prompts for "}'
            >
              <span data-i18n="Plan my next video">规划视频</span>
              <span>↗</span>
            </button>
          </div>
        </div>
        <div id="agent-activity" class="agent-activity" role="status" hidden>
          <span class="typing-dots"><i></i><i></i><i></i></span
          ><span id="activity-label"
            ><span data-i18n="Working on your request…"
              >正在处理你的请求…</span
            ></span
          >
        </div>
        <form id="composer" class="composer">
          <div
            id="composer-attachments"
            class="composer-attachments"
            aria-label="已附加的资源"
            data-i18n-attrs='{"aria-label": "Attached resources"}'
          ></div>
          <div class="editor-wrap">
            <div
              id="message"
              role="textbox"
              aria-label="发送给 Ads Agent 的消息"
              aria-multiline="true"
              contenteditable="false"
              data-placeholder="描述你的想法，或用 @ 引用资源…"
              data-i18n-attrs='{"aria-label": "Message to Ads Agent", "data-placeholder": "Describe your idea, or @ mention a resource…"}'
            ></div>
            <div
              id="mentions"
              class="mentions"
              role="listbox"
              aria-label="引用资源"
              hidden
              data-i18n-attrs='{"aria-label": "Mention a resource"}'
            ></div>
          </div>
          <div class="composer-footer">
            <button
              id="mention-button"
              class="mention-trigger"
              type="button"
              aria-label="引用资源"
              disabled
              data-i18n-attrs='{"aria-label": "Mention a resource"}'
            >
              @</button
            ><span class="keyboard-hint"
              ><span data-i18n="Enter to send">按 Enter 发送</span>
              <span>·</span>
              <span data-i18n="Shift + Enter for a new line"
                >Shift + Enter 换行</span
              ></span
            ><button id="stop" class="stop-button" type="button" hidden>
              <span data-i18n="■ Stop">■ 停止</span></button
            ><button
              id="send"
              class="send-button"
              type="submit"
              aria-label="发送消息"
              disabled
              data-i18n-attrs='{"aria-label": "Send message"}'
            >
              ↑
            </button>
          </div>
        </form>
      </aside>
    </main>
    <dialog id="connection-dialog">
      <form id="connection-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">
              <span data-i18n="YOUR WORKSPACE">工作区</span>
            </p>
            <h2><span data-i18n="Connection settings">连接设置</span></h2>
          </div>
          <button
            type="button"
            id="close-connection"
            class="icon-button"
            aria-label="关闭"
            data-i18n-attrs='{"aria-label": "Close"}'
          >
            ×
          </button>
        </div>
        <p class="muted">
          <span data-i18n="Choose the service endpoints for your workspace."
            >设置工作区使用的服务地址。</span
          >
        </p>
        <div class="connection-fields">
          <label class="field"
            ><span><span data-i18n="Agent URL">智能体服务地址</span></span
            ><input
              id="agent-url"
              type="url"
              placeholder="https://agent-staging.nuvalab.ai/api"
              required /></label
          ><label class="field"
            ><span
              ><span data-i18n="API URL">API 服务地址</span></span
            ><input
              id="api-url"
              type="url"
              placeholder="https://api-staging.nuvalab.ai"
              required /></label
          >
        </div>
        <p id="connection-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-footer">
          <button type="submit" class="primary" id="connect-submit">
            <span data-i18n="Apply settings ↗">应用设置 ↗</span>
          </button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/client.js"></script>
  </body>
</html>
